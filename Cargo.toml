[package]
name = "efficientloftr-onnx-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Rust ONNX Runtime inference wrapper for EfficientLoFTR-style semi-dense matching"
repository = "https://github.com/vlordier/efficientloftr-onnx-rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = true }
ndarray = "0.17.2"
ort = "2.0.0-rc.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "efficientloftr_onnx_rs"
path = "src/lib.rs"
